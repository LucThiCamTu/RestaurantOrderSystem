services:
  postgres-db:
    image: postgres:16-alpine
    container_name: kitchen-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Password123!
      POSTGRES_DB: KitchenOrderDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kitchen-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kitchen-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - kitchen-network

volumes:
  pgdata:

networks:
  kitchen-network:
    driver: bridge